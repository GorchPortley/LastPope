# Caddy terminates TLS and reports the original scheme in X-Forwarded-Proto.
# Pass that to PHP as HTTPS=on (see the sed on /etc/nginx/fastcgi_params in the Dockerfile),
# so isSecure(), url(), signed URLs and secure cookies work out of the box, with or without
# Laravel's TrustProxies middleware. Only Caddy can reach this nginx (internal Docker network),
# and Caddy always overwrites the header, so it cannot be spoofed from the internet.
map $http_x_forwarded_proto $lp_https {
    default "";
    https   on;
}
