# LastPope - production stack (Docker Compose v2.24 or newer).
#
#   caddy    HTTPS + reverse proxy; the only service that publishes ports (80, 443)
#   app      Laravel web app (nginx + PHP-FPM); runs migrations and caches on start
#   queue    Laravel queue worker  (php artisan queue:work)
#   scheduler Laravel scheduler    (php artisan schedule:work)
#   reverb   Laravel Reverb WebSocket server (live chat; self-hosted Pusher replacement), reached
#            through Caddy at wss://APP_DOMAIN/ws
#   mariadb  database for the app AND for the forum (two databases, two users)
#   redis    cache, sessions, queue
#   flarum   the forum (Flarum 2), reached through Caddy at https://APP_DOMAIN/forum
#   flarum-scheduler  runs Flarum's scheduler (`php flarum schedule:run`) every minute
#
# All settings come from `.env` (create it with `docker/setup.sh`). See docs/DEPLOY.md.
# For local development add the override file:  docker compose -f compose.yaml -f compose.dev.yaml up

# One copy of the stack per folder. Production and a dev copy on the same server need different names (and different
# CADDY_HTTP_BIND ports): set COMPOSE_PROJECT_NAME in each folder's .env, e.g. lastpope-prod (production) and lastpope (dev).
# The name also prefixes the containers, volumes and images, so the two never share data. See docs/DEPLOY.md, section 20.
name: ${COMPOSE_PROJECT_NAME:-lastpope}

# ---------------------------------------------------------------------------
# Shared definitions for the containers that run the Laravel code (app, queue, scheduler, reverb).
# ---------------------------------------------------------------------------
x-app-image: &app-image ${COMPOSE_PROJECT_NAME:-lastpope}-app:local

x-app-env: &app-env
  # Pre-wired infrastructure. These override whatever .env says (the .env copy of
  # DB_CONNECTION etc. is for running outside Docker), so the stack always talks
  # to its own containers.
  # STACK_ENV=demo in .env makes `db:seed` add the demo content (set DEMO_PASSWORD first on a public
  # server). Debug pages stay off either way: they would show your secrets to visitors.
  APP_ENV: ${STACK_ENV:-production}
  APP_DEBUG: "false"
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  APP_KEY: ${APP_KEY:?APP_KEY is empty - run docker/setup.sh first}
  APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is empty - run docker/setup.sh first}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql # the Laravel "mysql" driver also speaks to MariaDB
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: ${MARIADB_DATABASE:-lastpope}
  DB_USERNAME: ${MARIADB_USER:-lastpope}
  DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is empty - run docker/setup.sh first}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is empty - run docker/setup.sh first}
  CACHE_DRIVER: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # Forum: public URL (browser, SSO cookie) and container-to-container URL (server calls).
  FORUM_ENABLED: ${FORUM_ENABLED:-true}
  FLARUM_URL: https://${APP_DOMAIN}/forum
  FLARUM_INTERNAL_URL: http://flarum:8000/forum
  # Live chat (Chatify) over the self-hosted Reverb server (CHATIFY_DRIVER=pusher in .env would switch it
  # back to pusher.com). App id / key / secret come from .env (docker/setup.sh makes them); the rest is
  # wired here: PHP reaches the reverb container directly (http, no TLS), browsers connect to
  # wss://APP_DOMAIN/ws, which Caddy forwards to it.
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is empty - run docker/setup.sh first}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is empty - run docker/setup.sh first}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is empty - run docker/setup.sh first}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_PATH: /ws
  REVERB_CLIENT_HOST: ${APP_DOMAIN}
  REVERB_CLIENT_PORT: "443"
  REVERB_CLIENT_SCHEME: https
  # Only pages of this site may open a WebSocket to Reverb.
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-${APP_DOMAIN}}
  # Web server inside the image: Caddy is the trusted proxy in front of nginx.
  TRUSTED_PROXY: local
  # The app never needs these; do not hand them to PHP code.
  MARIADB_ROOT_PASSWORD: ""
  FLARUM_DB_PASSWORD: ""
  # FLARUM_ADMIN_PASSWORD does reach the app: a site admin whose e-mail is the forum admin's is logged into that forum
  # account with it (the API key may not reset its own account). The key itself already acts as any forum account.

x-app-common: &app-common
  image: *app-image
  restart: unless-stopped
  # Every other variable in .env (mail, Stripe keys, FLARUM_API_KEY, ...) is passed through.
  env_file:
    - path: .env
      required: false
  environment: *app-env
  volumes:
    - ${VOL_APP_STORAGE:-app-storage}:/var/www/html/storage/app
    - ${VOL_APP_LOGS:-app-logs}:/var/www/html/storage/logs
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    # Caddyfile (default): Caddy is the public web server on 80/443 and gets certificates itself.
    # Caddyfile.behind-proxy: an existing nginx/Apache on the host owns 80/443 and forwards to
    # CADDY_HTTP_BIND (e.g. 127.0.0.1:8880). docker/setup.sh sets these three for you.
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-Caddyfile}", "--adapter", "caddyfile"]
    ports:
      - "${CADDY_HTTP_BIND:-80}:80"
      - "${CADDY_HTTPS_BIND:-443}:443"
      - "${CADDY_HTTPS_BIND:-443}:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is empty - run docker/setup.sh first}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is empty - run docker/setup.sh first}
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - ${VOL_CADDY_DATA:-caddy-data}:/data # certificates: do not lose this volume
      - ${VOL_CADDY_CONFIG:-caddy-config}:/config
    depends_on:
      app:
        condition: service_started
      flarum:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Runs once before the site and the forum start, then exits. The containers run as www-data (uid 33) and cannot fix
  # ownership themselves; a folder Docker created (a new data/ folder, an emptied or new volume) belongs to root, which
  # breaks uploads and the forum ("Permission denied", "Unable to create a directory"). Only what is not owned by
  # www-data is touched, so a normal start changes nothing.
  fix-permissions:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "for d in /fix/*; do find \"$$d\" ! -user 33 -exec chown 33:33 {} +; done; echo storage owned by www-data"]
    volumes:
      - ${VOL_APP_STORAGE:-app-storage}:/fix/app-storage
      - ${VOL_APP_LOGS:-app-logs}:/fix/app-logs
      - ${VOL_FLARUM_STORAGE:-flarum-storage}:/fix/flarum-storage
      - ${VOL_FLARUM_ASSETS:-flarum-assets}:/fix/flarum-assets
    logging: *default-logging

  app:
    <<: *app-common
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      secrets:
        - composer_auth # optional, see docs/DEPLOY.md ("Could not authenticate against github.com")
    environment:
      <<: *app-env
      # serversideup/php: run migrations, storage:link and the Laravel caches on start.
      # Only this container does that; queue and scheduler wait for it to become healthy.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_TIMEOUT: "60"
      # Uploads: PHP and nginx limits come from UPLOAD_MAX_SIZE in .env.
      PHP_UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      PHP_POST_MAX_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      NGINX_CLIENT_MAX_BODY_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      PHP_MEMORY_LIMIT: 512M
      PHP_FPM_PM_MAX_CHILDREN: "10"
      PHP_MAX_EXECUTION_TIME: "120"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthcheck >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s # first start runs all migrations
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    <<: *app-common
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    stop_signal: SIGTERM
    stop_grace_period: 120s # let the current job finish
    environment:
      <<: *app-env
      PHP_MEMORY_LIMIT: 512M
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-common
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  # Laravel Reverb: the WebSocket server for live chat (Chatify). Same image as the app but no web server
  # and no migrations here (only `app` runs those). Not published on the host: Caddy forwards
  # wss://APP_DOMAIN/ws/app/... to it, and the app/queue containers call its HTTP API at
  # http://reverb:8080/ws/apps/... inside the Docker network.
  reverb:
    <<: *app-common
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
      PHP_MEMORY_LIMIT: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ws/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  # -------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.8.9
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is empty - run docker/setup.sh first}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-lastpope}
      MARIADB_USER: ${MARIADB_USER:-lastpope}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is empty - run docker/setup.sh first}
      MARIADB_AUTO_UPGRADE: "1"
      # Read by docker/mariadb/initdb.d/10-flarum.sh (first start only)
      FLARUM_DB_DATABASE: ${FLARUM_DB_DATABASE:-flarum}
      FLARUM_DB_USERNAME: ${FLARUM_DB_USERNAME:-flarum}
      FLARUM_DB_PASSWORD: ${FLARUM_DB_PASSWORD:?FLARUM_DB_PASSWORD is empty - run docker/setup.sh first}
    volumes:
      - ${VOL_MARIADB_DATA:-mariadb-data}:/var/lib/mysql
      - ./docker/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is empty - run docker/setup.sh first}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${VOL_REDIS_DATA:-redis-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # -------------------------------------------------------------------------
  # The forum: Flarum 2 + extensions, built from docker/flarum (nginx + PHP-FPM, served under /forum).
  # First start on an empty forum database installs it; on an existing one (for example the old Flarum 1.8
  # forum) it runs `php flarum migrate`. Details: docker/flarum/lib/start.php and docs/DEPLOY.md.
  flarum:
    build:
      context: docker/flarum
      secrets:
        - composer_auth # optional, see docs/DEPLOY.md ("Could not authenticate against github.com")
    image: ${COMPOSE_PROJECT_NAME:-lastpope}-flarum:2.0.2
    restart: unless-stopped
    environment:
      # The start-up scripts of the image: install / migrate / API key / extensions. Only this container does that.
      FLARUM_AUTORUN: "true"
      # Public URL including the /forum sub-path. Flarum builds every link from this.
      FLARUM_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is empty - run docker/setup.sh first}/forum
      FLARUM_FORUM_TITLE: ${FLARUM_FORUM_TITLE:-Community Forum}
      # First-install admin account (only used while the forum database is still empty)
      FLARUM_ADMIN_USER: ${FLARUM_ADMIN_USER:-forumadmin}
      FLARUM_ADMIN_EMAIL: ${FLARUM_ADMIN_EMAIL:-${ACME_EMAIL}}
      FLARUM_ADMIN_PASSWORD: ${FLARUM_ADMIN_PASSWORD:?FLARUM_ADMIN_PASSWORD is empty - run docker/setup.sh first}
      FLARUM_API_KEY: ${FLARUM_API_KEY:-}
      # Extensions to switch on in addition to the ones the image enables (ids or composer names, see DEPLOY.md).
      FLARUM_EXTENSIONS: ${FLARUM_EXTENSIONS:-}
      FLARUM_DEBUG: "false"
      FLARUM_DB_HOST: mariadb
      FLARUM_DB_PORT: "3306"
      FLARUM_DB_DATABASE: ${FLARUM_DB_DATABASE:-flarum}
      FLARUM_DB_USERNAME: ${FLARUM_DB_USERNAME:-flarum}
      FLARUM_DB_PASSWORD: ${FLARUM_DB_PASSWORD:?FLARUM_DB_PASSWORD is empty - run docker/setup.sh first}
      FLARUM_DB_PREFIX: flarum_ # do not change: it is the table prefix of existing forum databases
      # Flarum's own mail settings are copied from the app's MAIL_* once, at the first install.
      FLARUM_MAIL_DRIVER: ${MAIL_MAILER:-}
      FLARUM_MAIL_HOST: ${MAIL_HOST:-}
      FLARUM_MAIL_PORT: ${MAIL_PORT:-587}
      FLARUM_MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      FLARUM_MAIL_USERNAME: ${MAIL_USERNAME:-}
      FLARUM_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FLARUM_MAIL_FROM: ${MAIL_FROM_ADDRESS:-}
      # Uploads (fof/upload, avatars): PHP and nginx limits come from UPLOAD_MAX_SIZE in .env.
      PHP_UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      PHP_POST_MAX_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      NGINX_CLIENT_MAX_BODY_SIZE: ${UPLOAD_MAX_SIZE:-256M}
      PHP_MAX_EXECUTION_TIME: "120"
      TZ: ${TZ:-UTC}
    volumes:
      - ${VOL_FLARUM_STORAGE:-flarum-storage}:/var/www/html/storage # caches, logs, sessions, GDPR exports
      - ${VOL_FLARUM_ASSETS:-flarum-assets}:/var/www/html/public/assets # compiled JS/CSS, avatars, uploads (fof/upload), logo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/forum/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s # first start: install; upgrade of a 1.x forum: migrations
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    logging: *default-logging

  # Flarum has no scheduler daemon: this runs `php flarum schedule:run` at the start of every minute
  # (same image, no web server; see docker/flarum/bin/flarum-scheduler). It shares the storage volume
  # with the forum, so the administration can see that the scheduler is alive.
  flarum-scheduler:
    image: ${COMPOSE_PROJECT_NAME:-lastpope}-flarum:2.0.2
    restart: unless-stopped
    command: ["flarum-scheduler"]
    stop_signal: SIGTERM
    environment:
      # no FLARUM_AUTORUN: this container only waits for the forum and writes config.php
      FLARUM_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is empty - run docker/setup.sh first}/forum
      FLARUM_DB_HOST: mariadb
      FLARUM_DB_PORT: "3306"
      FLARUM_DB_DATABASE: ${FLARUM_DB_DATABASE:-flarum}
      FLARUM_DB_USERNAME: ${FLARUM_DB_USERNAME:-flarum}
      FLARUM_DB_PASSWORD: ${FLARUM_DB_PASSWORD:?FLARUM_DB_PASSWORD is empty - run docker/setup.sh first}
      FLARUM_DB_PREFIX: flarum_
      TZ: ${TZ:-UTC}
    volumes:
      - ${VOL_FLARUM_STORAGE:-flarum-storage}:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/flarum-scheduler.alive -mmin -3 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      flarum:
        condition: service_healthy
    logging: *default-logging

secrets:
  composer_auth:
    environment: COMPOSER_AUTH # only used while building the image; empty is fine

# Where the data lives. By default in Docker volumes (only reachable through Docker). To keep it in plain folders in
# this directory instead (./data/<name>, readable with sudo), run docker/data/move-to-host.sh once: it copies every
# volume there and sets the VOL_* settings in .env that the mounts above use. See "Where the data lives" in docs/DEPLOY.md.
volumes:
  mariadb-data:
  redis-data:
  app-storage: # storage/app: uploads, snapshots, private files
  app-logs: # storage/logs
  flarum-storage: # forum: storage/ (caches, logs, sessions)
  flarum-assets: # forum: public/assets/ (compiled JS/CSS, avatars, uploads)
  caddy-data:
  caddy-config:
